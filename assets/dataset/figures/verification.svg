<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="Verification funnel and rejection reasons">
<rect width="1180" height="300" fill="#ffffff"/>
<text x="60" y="32" font-size="15" font-weight="600" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">Episodes</text>
<rect x="60" y="54" width="420.0" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="76" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">5,623</text>
<text x="492" y="76" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">recorded attempts</text>
<rect x="60" y="104" width="368.8" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="126" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,937</text>
<text x="492" y="126" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">successful episodes saved</text>
<rect x="60" y="154" width="359.0" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="176" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,806</text>
<text x="492" y="176" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">passed every check</text>
<rect x="60" y="204" width="358.5" height="34" fill="#0d6772" rx="2"/>
<text x="68" y="226" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,800</text>
<text x="492" y="226" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">selected, 80 per task and condition</text>
<text x="700" y="32" font-size="15" font-weight="600" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">Rejected by the checks (131 of 4,937, replaced)</text>
<text x="940" y="72" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">video frame dropped by the encoder</text>
<rect x="950" y="54" width="190.0" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="1148.0" y="72" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">71</text>
<text x="940" y="112" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">length outside 0.6–1.5× the median</text>
<rect x="950" y="94" width="64.2" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="1022.2" y="112" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">24</text>
<text x="940" y="152" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">base rolled or pitched past 25° (crash)</text>
<rect x="950" y="134" width="61.5" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="1019.5" y="152" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">23</text>
<text x="940" y="192" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">sub-criterion false at success</text>
<rect x="950" y="174" width="34.8" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="992.8" y="192" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">13</text>
</svg>