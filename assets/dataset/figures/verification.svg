<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="Verification funnel and rejection reasons">
<rect width="1180" height="300" fill="#ffffff"/>
<text x="60" y="32" font-size="15" font-weight="600" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">Episodes</text>
<rect x="60" y="54" width="420.0" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="76" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">5,559</text>
<text x="492" y="76" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">recorded attempts</text>
<rect x="60" y="104" width="372.5" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="126" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,930</text>
<text x="492" y="126" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">successful episodes saved</text>
<rect x="60" y="154" width="362.9" height="34" fill="#9fc3c8" rx="2"/>
<text x="68" y="176" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,803</text>
<text x="492" y="176" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">passed every check</text>
<rect x="60" y="204" width="362.7" height="34" fill="#0d6772" rx="2"/>
<text x="68" y="226" font-size="14" fill="#ffffff" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">4,800</text>
<text x="492" y="226" font-size="14" fill="#4f5862" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">selected, 80 per task and condition</text>
<text x="700" y="32" font-size="15" font-weight="600" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">Rejected by the checks (127 of 4,930, replaced)</text>
<text x="940" y="72" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">video frame dropped by the encoder</text>
<rect x="950" y="54" width="190.0" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="1148.0" y="72" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">68</text>
<text x="940" y="112" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">base rolled or pitched past 25° (crash)</text>
<rect x="950" y="94" width="64.3" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="1022.3" y="112" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">23</text>
<text x="940" y="152" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">sub-criterion false at success</text>
<rect x="950" y="134" width="33.5" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="991.5" y="152" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">12</text>
<text x="940" y="192" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">thrown off by the wind, recovered</text>
<rect x="950" y="174" width="30.7" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="988.7" y="192" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">11</text>
<text x="940" y="232" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">target ran off (lemon steered after it fell)</text>
<rect x="950" y="214" width="22.4" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="980.4" y="232" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">8</text>
<text x="940" y="272" font-size="13" fill="#4f5862" text-anchor="end" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">length outside 0.6–1.5× the median</text>
<rect x="950" y="254" width="14.0" height="26" fill="#9a3412" opacity="0.85" rx="2"/>
<text x="972.0" y="272" font-size="14" fill="#1b1f24" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">5</text>
</svg>