<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="Pipeline from the scripted specialist to the training set" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5862"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="1180" height="330" fill="#ffffff"/>

  <!-- stage numbers -->
  <g font-size="12" fill="#7b848d" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">
    <text x="20" y="48">1</text><text x="216" y="48">2</text><text x="412" y="48">3</text>
    <text x="608" y="48">4</text><text x="804" y="48">5</text><text x="1000" y="48">6</text>
  </g>

  <!-- boxes -->
  <g stroke="#e2e6e9" fill="#ffffff">
    <rect x="20" y="58" width="164" height="150" rx="6"/>
    <rect x="216" y="58" width="164" height="150" rx="6"/>
    <rect x="412" y="58" width="164" height="150" rx="6"/>
    <rect x="608" y="58" width="164" height="150" rx="6"/>
    <rect x="804" y="58" width="164" height="150" rx="6"/>
    <rect x="1000" y="58" width="164" height="150" rx="6"/>
  </g>
  <g stroke="#0d6772" stroke-width="3">
    <line x1="20" y1="58" x2="184" y2="58"/><line x1="216" y1="58" x2="380" y2="58"/><line x1="412" y1="58" x2="576" y2="58"/>
    <line x1="608" y1="58" x2="772" y2="58"/><line x1="804" y1="58" x2="968" y2="58"/><line x1="1000" y1="58" x2="1164" y2="58"/>
  </g>

  <!-- titles -->
  <g font-size="15.5" font-weight="700" fill="#1b1f24">
    <text x="32" y="84">Scripted specialist</text>
    <text x="228" y="84">Noise injection</text>
    <text x="424" y="84">FA-Hexa, Isaac Lab</text>
    <text x="620" y="84">Recorder</text>
    <text x="816" y="84">Verification</text>
    <text x="1012" y="84">Selection, export</text>
  </g>

  <!-- body text -->
  <g font-size="12.5" fill="#4f5862">
    <text x="32" y="106">one per task (Part 2),</text>
    <text x="32" y="123">closed loop on the</text>
    <text x="32" y="140">measured object state</text>
    <text x="32" y="166">output: absolute EE</text>
    <text x="32" y="183">target + gripper (8-D)</text>

    <text x="228" y="106">smooth random drift</text>
    <text x="228" y="123">σ = 5 mm, 0.025 rad,</text>
    <text x="228" y="140">new offset every 0.5 s</text>
    <text x="228" y="166">executed = target + drift</text>
    <text x="228" y="183">label = target</text>

    <text x="424" y="106">IK + PID at 120 Hz</text>
    <text x="424" y="123">cameras every 6th step</text>
    <text x="424" y="140">(20 Hz), 4 envs × 2 GPU slots</text>
    <text x="424" y="166">disturbances: thrust limits,</text>
    <text x="424" y="183">aero, wind 5 / 10 / 20 %</text>

    <text x="620" y="106">LeRobot v3, successes only</text>
    <text x="620" y="123">20 Hz: 2 × 384² images,</text>
    <text x="620" y="140">35-D state, label, executed</text>
    <text x="620" y="166">120 Hz: state and labels</text>
    <text x="620" y="183">at every control step</text>

    <text x="816" y="106">per episode: success and</text>
    <text x="816" y="123">sub-criteria, frame and</text>
    <text x="816" y="140">segment counts, clean</text>
    <text x="816" y="157">start, length, condition,</text>
    <text x="816" y="174">prompt; first / mid / last</text>
    <text x="816" y="191">frames decoded</text>

    <text x="1012" y="106">80 per task and condition</text>
    <text x="1012" y="123">(4,800 in all)</text>
    <text x="1012" y="149">π0.5: OpenPI LeRobot v2.1,</text>
    <text x="1012" y="166">20 Hz, PNG, both cameras</text>
    <text x="1012" y="183">DiT: manifest over the</text>
    <text x="1012" y="200">120 Hz + 20 Hz sets</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#4f5862" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="184" y1="133" x2="214" y2="133"/>
    <line x1="380" y1="133" x2="410" y2="133"/>
    <line x1="576" y1="133" x2="606" y2="133"/>
    <line x1="772" y1="133" x2="802" y2="133"/>
    <line x1="968" y1="133" x2="998" y2="133"/>
  </g>

  <!-- feedback: rejected episodes are replaced -->
  <path d="M 886 208 L 886 262 L 494 262 L 494 210" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-bad)"/>
  <text x="690" y="256" text-anchor="middle" font-size="12.5" fill="#9a3412">rejected episodes are re-recorded (282 of 5,085)</text>

  <!-- data flow labels -->
  <g font-size="11.5" fill="#7b848d">
    <text x="199" y="124" text-anchor="middle">target</text>
    <text x="395" y="124" text-anchor="middle">noisy</text>
    <text x="395" y="150" text-anchor="middle">target</text>
    <text x="591" y="124" text-anchor="middle">obs,</text>
    <text x="591" y="150" text-anchor="middle">images</text>
    <text x="787" y="124" text-anchor="middle">episodes</text>
    <text x="983" y="124" text-anchor="middle">valid</text>
  </g>

  <text x="20" y="306" font-size="12.5" fill="#7b848d">Only episodes that reach the task's success check are saved; the controller runs at 120 Hz throughout, so a 20 Hz image is the exact render of the state it is paired with.</text>
</svg>
