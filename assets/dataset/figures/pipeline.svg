<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="Pipeline from the scripted specialist to the training set" font-family="'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5862"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="1180" height="330" fill="#ffffff"/>

  <!-- stage numbers -->
  <g font-size="12" fill="#7b848d" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">
    <text x="20" y="48">1</text><text x="218" y="48">2</text><text x="416" y="48">3</text>
    <text x="614" y="48">4</text><text x="812" y="48">5</text><text x="1010" y="48">6</text>
  </g>

  <!-- boxes: 150 wide, 48 apart -->
  <g stroke="#e2e6e9" fill="#ffffff">
    <rect x="20" y="58" width="150" height="150" rx="6"/>
    <rect x="218" y="58" width="150" height="150" rx="6"/>
    <rect x="416" y="58" width="150" height="150" rx="6"/>
    <rect x="614" y="58" width="150" height="150" rx="6"/>
    <rect x="812" y="58" width="150" height="150" rx="6"/>
    <rect x="1010" y="58" width="150" height="150" rx="6"/>
  </g>
  <g stroke="#0d6772" stroke-width="3">
    <line x1="20" y1="58" x2="170" y2="58"/><line x1="218" y1="58" x2="368" y2="58"/><line x1="416" y1="58" x2="566" y2="58"/>
    <line x1="614" y1="58" x2="764" y2="58"/><line x1="812" y1="58" x2="962" y2="58"/><line x1="1010" y1="58" x2="1160" y2="58"/>
  </g>

  <!-- titles -->
  <g font-size="15.5" font-weight="700" fill="#1b1f24">
    <text x="31" y="84">Specialist</text>
    <text x="229" y="84">Noise injection</text>
    <text x="427" y="84">FA-Hexa, Isaac Lab</text>
    <text x="625" y="84">Recorder</text>
    <text x="823" y="84">Verification</text>
    <text x="1021" y="84">Selection, export</text>
  </g>

  <!-- body text -->
  <g font-size="12.5" fill="#4f5862">
    <text x="31" y="106">scripted, one per task</text>
    <text x="31" y="123">(Part 2); closed loop</text>
    <text x="31" y="140">on the measured</text>
    <text x="31" y="157">object state</text>
    <text x="31" y="181">output: EE target</text>
    <text x="31" y="198">+ gripper (8-D)</text>

    <text x="229" y="106">smooth random drift</text>
    <text x="229" y="123">σ = 5 mm, 0.025 rad</text>
    <text x="229" y="140">new offset every 0.5 s</text>
    <text x="229" y="164">executed = target</text>
    <text x="229" y="181">+ drift</text>
    <text x="229" y="198">label = clean target</text>

    <text x="427" y="106">IK + PID at 120 Hz</text>
    <text x="427" y="123">cameras every 6th</text>
    <text x="427" y="140">step (20 Hz)</text>
    <text x="427" y="157">4 envs × 2 processes</text>
    <text x="427" y="181">thrust limits, aero,</text>
    <text x="427" y="198">wind 5 / 10 / 20 %</text>

    <text x="625" y="106">LeRobot v3,</text>
    <text x="625" y="123">successes only</text>
    <text x="625" y="140">20 Hz: 2 cameras,</text>
    <text x="625" y="157">state, label, executed</text>
    <text x="625" y="181">120 Hz: state and</text>
    <text x="625" y="198">label, every step</text>

    <text x="823" y="106">per episode: success</text>
    <text x="823" y="123">and sub-criteria,</text>
    <text x="823" y="140">frame and segment</text>
    <text x="823" y="157">counts, clean start,</text>
    <text x="823" y="174">length, condition,</text>
    <text x="823" y="191">prompt, decoded frames</text>

    <text x="1021" y="106">80 per task and</text>
    <text x="1021" y="123">condition: 4,800</text>
    <text x="1021" y="147">π0.5: OpenPI format,</text>
    <text x="1021" y="164">20 Hz, PNG, 2 cameras</text>
    <text x="1021" y="188">DiT: 120 Hz + 20 Hz</text>
    <text x="1021" y="205">sets, manifest</text>
  </g>

  <!-- arrows between the boxes, labels above them -->
  <g stroke="#4f5862" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="172" y1="150" x2="216" y2="150"/>
    <line x1="370" y1="150" x2="414" y2="150"/>
    <line x1="568" y1="150" x2="612" y2="150"/>
    <line x1="766" y1="150" x2="810" y2="150"/>
    <line x1="964" y1="150" x2="1008" y2="150"/>
  </g>
  <g font-size="11" fill="#7b848d" text-anchor="middle">
    <text x="194" y="141">target</text>
    <text x="392" y="128">noisy</text><text x="392" y="141">target</text>
    <text x="590" y="128">obs,</text><text x="590" y="141">images</text>
    <text x="788" y="141">episodes</text>
    <text x="986" y="141">valid</text>
  </g>

  <!-- feedback: rejected episodes are replaced -->
  <path d="M 887 208 L 887 262 L 491 262 L 491 210" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-bad)"/>
  <text x="689" y="256" text-anchor="middle" font-size="12.5" fill="#9a3412">rejected episodes are re-recorded (282 of 5,085)</text>

  <text x="20" y="306" font-size="12.5" fill="#7b848d">Only episodes that reach the task's success check are saved; the controller runs at 120 Hz throughout, so a 20 Hz image is the exact render of the state it is paired with.</text>
</svg>
